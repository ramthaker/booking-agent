stages:
  - test

# Offline tests use synthetic fixtures only; no credentials required.
workshop_tests:
  stage: test
  image: python:3.12-slim
  script:
    - python -m unittest discover -s tests -v
    - python -m agent_workshop.cli mr-risky > mr-risky-report.txt
    - python -m agent_workshop.cli race > race-report.txt
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - mr-risky-report.txt
      - race-report.txt
