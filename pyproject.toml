[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "from-demo-to-production-workshop"
version = "1.0.0"
description = "Offline-safe appointment and MR review multi-agent workshop"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["agent_workshop*"]
